<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automation Test - Custom Dropdown Known Limit</title>
  <style>body{font:16px Arial;max-width:680px;margin:40px auto;padding:0 20px}.field{margin:20px 0}label{display:block;margin-bottom:6px}input,.fake-select{padding:10px;width:100%;max-width:420px;border:1px solid #777;box-sizing:border-box}.fake-select{background:#fafafa;cursor:pointer}</style>
</head>
<body>
  <h1>Custom dropdown capability test</h1>
  <p>This page intentionally uses a div with role=combobox instead of a native select.</p>
  <div class="field"><label for="first">First Name</label><input id="first" type="text"></div>
  <div class="field">
    <label>Gender</label>
    <div>
      <div><input type="radio" name="gender" value="Male"><span>Male</span></div>
      <div><input type="radio" name="gender" value="Female"><span>Female</span></div>
      <div><input type="radio" name="gender" value="Other"><span>Other</span></div>
    </div>
  </div>
  <div class="field">
    <div class="fake-select" role="combobox" aria-label="State" aria-expanded="false" tabindex="0">Choose a state</div>
  </div>
</body>
</html>
