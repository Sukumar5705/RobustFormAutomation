<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automation Test - Text Node Labels</title>
  <style>body{font:16px Arial;max-width:680px;margin:40px auto;padding:0 20px}.field{margin:22px 0}input,select{padding:9px;margin-left:10px;width:260px}fieldset{margin:20px 0;padding:14px}fieldset label{margin-right:15px}</style>
</head>
<body>
  <h1>Bare text node label test</h1>
  <div class="field">First Name <input type="text" autocomplete="off"></div>
  <fieldset>
    <legend>Gender</legend>
    <label><input type="radio" name="gender" value="Male"><span>Male</span></label>
    <label><input type="radio" name="gender" value="Female"><span>Female</span></label>
    <label><input type="radio" name="gender" value="Other"><span>Other</span></label>
  </fieldset>
  <div class="field">State <select><option value="">Choose</option><option value="India">India</option><option value="Telangana">Telangana</option></select></div>
</body>
</html>
