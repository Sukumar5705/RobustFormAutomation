<!DOCTYPE html>
<html>

<head>
    <title>Modified Form - Decoy Fields</title>
</head>

<body>

    <h2>Automation Practice Form</h2>

    <div>
        <label>Last Name</label>
        <input type="text">
    </div>

    <div>
        <label>Middle Name</label>
        <input type="text">
    </div>

    <div>
        <label>First Name</label>
        <input type="text">
    </div>

    <div>
        <label>Country</label>

        <select>
            <option>India</option>
            <option>Canada</option>
        </select>
    </div>

    <div>
        <label>State</label>

        <select>
            <option>Select State</option>
            <option>Telangana</option>
            <option>Andhra Pradesh</option>
        </select>
    </div>

    <div>
        <label>Gender</label>

        <div>
            <input type="radio" value="Male">
            <span>Male</span>

            <input type="radio" value="Female">
            <span>Female</span>
        </div>
    </div>

</body>

</html>
