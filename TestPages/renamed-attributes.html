<!DOCTYPE html>
<html>

<head>
    <title>Modified Form - No IDs</title>
</head>

<body>

    <h2>Automation Practice Form</h2>

    <div>
        <label>First Name</label>
        <input type="text">
    </div>

    <div>
        <label>Gender</label>

        <div>
            <input type="radio" value="Male">
            <span>Male</span>

            <input type="radio" value="Female">
            <span>Female</span>
        </div>
    </div>

    <div>
        <label>State</label>

        <select>
            <option value="">Select</option>
            <option value="India">India</option>
            <option value="Canada">Canada</option>
        </select>
    </div>

</body>

</html>
